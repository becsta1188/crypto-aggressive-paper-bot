
name: Aggressive Multi-Crypto Paper Trader

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-aggressive-paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggressive crypto paper trader
        run: python bot.py

      - name: Save simulated trading state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f crypto_state.json ]; then
            git add -f crypto_state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save crypto paper trading state'
              git pull --rebase
              git push
            fi
          else
            echo "No trading state created this run"
          fi
